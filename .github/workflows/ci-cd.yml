name: CI/CD DevSecOps

# Ver docs/DEVSECOPS.md. El repo de referencia del curso (cursos-tecylab/DVO20JUN26)
# no fue accesible (404 publico) — este pipeline usa practicas estandar equivalentes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  id-token: write   # requerido para OIDC hacia AWS, sin access keys estaticas
  contents: read
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: <ECR_REGISTRY> # completar con el valor real, ej. 123456789012.dkr.ecr.us-east-1.amazonaws.com
  EKS_CLUSTER: plataforma-comercial

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
        working-directory: ${{ matrix.app }}
      - run: npm run lint
        working-directory: ${{ matrix.app }}
      - run: npm run build
        working-directory: ${{ matrix.app }}
      - if: matrix.app == 'backend'
        run: npm test
        working-directory: backend

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  sca-dependencias:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: ${{ matrix.app }}
      # backend: los altos restantes viven solo en el toolchain de dev (@nestjs/cli
      # -> @angular-devkit/*), nunca se empaquetan en la imagen de produccion.
      - if: matrix.app == 'backend'
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend
      # frontend: migrado a next@15.5.23 (2026-08-07, ver docs/CI_MEJORAS_FUTURAS.md#0)
      # -- ya no hace falta la excepcion a critical que tuvo este job.
      - if: matrix.app == 'frontend'
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ matrix.app }}
          severity: CRITICAL,HIGH
          exit-code: 1

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-scan-imagen:
    needs: [lint-and-test, sast, sca-dependencias, secret-scan]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [backend, frontend]
    outputs:
      backend-sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker build -t plataforma/${{ matrix.app }}:${{ github.sha }} ${{ matrix.app }}
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: plataforma/${{ matrix.app }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1

  # Deshabilitado (2026-08-02): el equipo actual no usa el cluster EKS
  # (plataforma-comercial nunca se creo, ni el rol IAM github-actions-deploy,
  # ni ECR_REGISTRY/ACCOUNT_ID reales estan completados) — se descarto
  # Kubernetes por escala (ver docs/DESPLIEGUE_AWS.md) a favor de 2 EC2 con
  # Docker Compose, desplegadas a mano por SSM/SSH. Se deja el job entero
  # (no se borra) por si el proyecto escala a e-commerce publico y conviene
  # retomar Kubernetes — para reactivarlo, completar ECR_REGISTRY/ACCOUNT_ID
  # y sacar el "false && " de este if.
  push-y-deploy-qa:
    if: false && github.ref == 'refs/heads/main'
    needs: [build-and-scan-imagen]
    runs-on: ubuntu-latest
    environment: qa
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      - run: aws ecr get-login-password | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}
      - run: |
          for app in backend frontend; do
            docker build -t ${{ env.ECR_REGISTRY }}/plataforma/$app:${{ github.sha }} $app
            docker push ${{ env.ECR_REGISTRY }}/plataforma/$app:${{ github.sha }}
          done
      - uses: aws-actions/amazon-eks-update-kubeconfig@v2
        with:
          cluster-name: ${{ env.EKS_CLUSTER }}
      - run: |
          kubectl set image deployment/backend backend=${{ env.ECR_REGISTRY }}/plataforma/backend:${{ github.sha }} -n plataforma
          kubectl set image deployment/frontend frontend=${{ env.ECR_REGISTRY }}/plataforma/frontend:${{ github.sha }} -n plataforma

  # Deshabilitado (2026-08-02) — mismo motivo que push-y-deploy-qa arriba.
  deploy-produccion:
    if: false
    needs: [push-y-deploy-qa]
    runs-on: ubuntu-latest
    environment: production # gate de aprobacion manual (RFD 11.4, paso 5) — configurar reviewers en Settings > Environments
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::<ACCOUNT_ID>:role/github-actions-deploy
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-eks-update-kubeconfig@v2
        with:
          cluster-name: ${{ env.EKS_CLUSTER }}
      - run: |
          kubectl set image deployment/backend backend=${{ env.ECR_REGISTRY }}/plataforma/backend:${{ github.sha }} -n plataforma
          kubectl set image deployment/frontend frontend=${{ env.ECR_REGISTRY }}/plataforma/frontend:${{ github.sha }} -n plataforma
          kubectl rollout status deployment/backend -n plataforma
          kubectl rollout status deployment/frontend -n plataforma
      # Rollback manual si falla: kubectl rollout undo deployment/<nombre> -n plataforma
