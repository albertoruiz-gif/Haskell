apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: plataforma
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: plataforma-backend
      containers:
        - name: backend
          image: <ECR_REGISTRY>/plataforma/backend:<TAG>
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: plataforma-secrets
          env:
            - name: USE_AWS_SECRETS_MANAGER
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: plataforma-db
                  key: DATABASE_URL
          volumeMounts:
            - name: secrets-store
              mountPath: /mnt/secrets-store
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 20
      volumes:
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: plataforma-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: plataforma
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: plataforma
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
