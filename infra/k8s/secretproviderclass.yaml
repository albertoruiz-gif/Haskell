# Monta los secretos de AWS Secrets Manager como variables de entorno del
# pod, sin que pasen nunca por el repo ni por GitHub Actions en texto plano.
# Requiere el Secrets Store CSI Driver (ver docs/DESPLIEGUE_AWS.md paso 5).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: plataforma-secrets
  namespace: plataforma
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "plataforma/odoo"
        objectType: "secretsmanager"
        jmesPath:
          - path: "url"
            objectAlias: "odoo-url"
          - path: "db"
            objectAlias: "odoo-db"
          - path: "apiKey"
            objectAlias: "odoo-api-key"
      - objectName: "plataforma/culqi"
        objectType: "secretsmanager"
        jmesPath:
          - path: "privateKey"
            objectAlias: "culqi-private-key"
          - path: "publicKey"
            objectAlias: "culqi-public-key"
  secretObjects:
    - secretName: plataforma-secrets
      type: Opaque
      data:
        - objectName: odoo-url
          key: ODOO_URL
        - objectName: odoo-db
          key: ODOO_DB
        - objectName: odoo-api-key
          key: ODOO_API_KEY
        - objectName: culqi-private-key
          key: CULQI_PRIVATE_KEY
        - objectName: culqi-public-key
          key: CULQI_PUBLIC_KEY
