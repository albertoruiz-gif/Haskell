version: '3.9'

# Uso local (desarrollo): los valores por defecto de abajo (plataforma/plataforma)
# alcanzan. En Test/Producción, definir POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB/
# NEXT_PUBLIC_API_URL en infra/.env (no versionado — ver infra/.env.example) con
# valores reales antes de levantar los contenedores: nunca dejar la contraseña de
# ejemplo en un ambiente real.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plataforma}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_dev}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plataforma}:${POSTGRES_PASSWORD:-plataforma}@postgres:5432/${POSTGRES_DB:-plataforma_dev}
    ports:
      - '3000:3000'
    depends_on:
      - postgres

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - '3001:3000'
    depends_on:
      - backend

volumes:
  pgdata:
