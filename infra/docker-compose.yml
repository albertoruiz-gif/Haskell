# Uso local (desarrollo): los valores por defecto de abajo (plataforma/plataforma)
# alcanzan. En Test/Producción, definir POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB/
# NEXT_PUBLIC_API_URL en infra/.env (no versionado — ver infra/.env.example) con
# valores reales antes de levantar los contenedores: nunca dejar la contraseña de
# ejemplo en un ambiente real.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plataforma}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_dev}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-plataforma} -d ${POSTGRES_DB:-plataforma_dev}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plataforma}:${POSTGRES_PASSWORD:-plataforma}@postgres:5432/${POSTGRES_DB:-plataforma_dev}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - '3001:3000'
    depends_on:
      - backend
    restart: unless-stopped

  # Proxy reverso HTTPS — puerta de entrada única en :80/:443 (nginx.conf.template:
  # /api y /uploads al backend, todo lo demás al frontend, 80 redirige a 443).
  # Necesario en Test/Producción porque el security group solo abre 80/443, no
  # 3000/3001. DOMAIN y los certificados de Let's Encrypt son propios de cada
  # servidor (definir DOMAIN en infra/.env — ver infra/.env.example). En local
  # este servicio no tiene certificado y puede fallar al arrancar; no afecta a
  # backend/frontend, que se siguen usando directo en localhost:3000/3001.
  nginx:
    image: nginx:alpine
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - '80:80'
      - '443:443'
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
