# Uso local (desarrollo): los valores por defecto de abajo (plataforma/plataforma)
# alcanzan. En Test/Producción, definir POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB/
# NEXT_PUBLIC_API_URL en infra/.env (no versionado — ver infra/.env.example) con
# valores reales antes de levantar los contenedores: nunca dejar la contraseña de
# ejemplo en un ambiente real.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plataforma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plataforma}
      POSTGRES_DB: ${POSTGRES_DB:-plataforma_dev}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-plataforma} -d ${POSTGRES_DB:-plataforma_dev}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ../backend
    env_file: ../backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-plataforma}:${POSTGRES_PASSWORD:-plataforma}@postgres:5432/${POSTGRES_DB:-plataforma_dev}
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000/api}
    ports:
      - '3001:3000'
    depends_on:
      - backend
    restart: unless-stopped

  # Proxy reverso — puerta de entrada única en :80 (nginx.conf: /api y /uploads
  # al backend, todo lo demás al frontend). Necesario en Test/Producción porque
  # el security group solo abre 80/443, no 3000/3001. En local es opcional
  # (se puede seguir usando localhost:3000/3001 directo).
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - '80:80'
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  pgdata:
